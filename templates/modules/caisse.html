{% extends "base.html" %}
{% block sidebar %}
<button class="nav-item active" onclick="nav('caisse-saisir')" data-nav="caisse-saisir"><span class="ico">✏️</span> Saisir Rapport</button>
<button class="nav-item" onclick="nav('caisse-historique')" data-nav="caisse-historique"><span class="ico">📋</span> Historique</button>
{% endblock %}
{% block content %}
<div id="s-caisse-saisir" class="section active">
  <div class="section-title">✏️ Nouveau Rapport de Caisse</div>
  <div class="card">
    <div class="form-grid">
      <div class="fgroup"><label>Date *</label><input type="date" id="rc-date"></div>
      <div class="fgroup"><label>Commercial *</label><input type="text" id="rc-commercial" placeholder="Nom du commercial"></div>
      <div class="fgroup"><label>Total Ventes (FCFA)</label><input type="number" id="rc-ventes" placeholder="0" step="100"></div>
      <div class="fgroup"><label>Total Encaisse (FCFA)</label><input type="number" id="rc-encaisse" placeholder="0" step="100"></div>
      <div class="fgroup"><label>Total Credit (FCFA)</label><input type="number" id="rc-credit" placeholder="0" step="100"></div>
    </div>
    <div style="margin-top:12px">
      <div class="card-title">Lignes de factures</div>
      <div id="rc-lignes"></div>
      <button class="btn btn-outline btn-sm" style="margin-top:8px" onclick="ajouterLigne()">+ Ajouter une facture</button>
    </div>
    <button class="btn btn-gold" style="margin-top:16px" onclick="sauvegarderRC()">💾 Enregistrer le rapport</button>
    <div id="rc-msg" style="margin-top:8px;font-size:12px"></div>
  </div>
</div>
<div id="s-caisse-historique" class="section">
  <div class="section-title">📋 Historique des Rapports</div>
  <div class="card"><button class="btn btn-navy" onclick="chargerHistoriqueRC()">🔄 Charger</button></div>
  <div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Commercial</th><th>Ventes</th><th>Encaisse</th><th>Credit</th><th>Statut</th></tr></thead>
  <tbody id="rc-hist-tbody"><tr><td colspan="6" class="tbl-empty">Cliquez Charger</td></tr></tbody></table></div>
</div>
{% endblock %}
