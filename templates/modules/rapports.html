{% extends "base.html" %}
{% block sidebar %}
<button class="nav-item active" onclick="nav('rpt-caisse')" data-nav="rpt-caisse"><span class="ico">🏪</span> Rapport Caisse</button>
<button class="nav-item" onclick="nav('rpt-stock')" data-nav="rpt-stock"><span class="ico">📦</span> Rapport Stock</button>
<button class="nav-item" onclick="nav('rpt-creances')" data-nav="rpt-creances"><span class="ico">💳</span> Rapport Creances</button>
{% endblock %}
{% block content %}
<div id="s-rpt-caisse" class="section active">
  <div class="section-title">🏪 Rapport de Caisse Excel</div>
  <div class="card">
    <div class="form-grid">
      <div class="fgroup"><label>Mois</label><input type="month" id="rpt-mois"></div>
      <div class="fgroup"><label>Agence</label>
        <select id="rpt-agence">
          <option value="BERTOUA">Bertoua</option>
          <option value="DOUALA">Douala</option>
          <option value="YAOUNDE">Yaounde</option>
        </select>
      </div>
    </div>
    <button class="btn btn-gold" style="margin-top:12px" onclick="genererRapportCaisse()">📊 Generer Rapport Excel</button>
    <div id="rpt-msg" style="margin-top:8px;font-size:12px"></div>
  </div>
</div>
<div id="s-rpt-stock" class="section">
  <div class="section-title">📦 Rapport Stock</div>
  <div class="card"><div class="alert alert-info">Rapport d'inventaire — En cours de developpement.</div></div>
</div>
<div id="s-rpt-creances" class="section">
  <div class="section-title">💳 Rapport Creances</div>
  <div class="card"><div class="alert alert-info">Balance agee exportable — En cours de developpement.</div></div>
</div>
{% endblock %}
