{% extends "base.html" %}
{% block sidebar %}
<div class="nav-group">
  <button class="nav-group-btn open" onclick="toggleGroup(this)"><span>🏆</span> Consolidation <span class="arrow">▶</span></button>
  <div class="nav-group-children open">
    <button class="nav-item-sub active" onclick="navSub(this,'cons-global')" data-nav="cons-global">🏆 Vue Globale</button>
    <button class="nav-item-sub" onclick="navSub(this,'cons-stock')" data-nav="cons-stock">🌐 Stock Reseau</button>
  </div>
</div>
{% endblock %}
{% block content %}
<div id="s-cons-global" class="section active">
  <div class="section-title">🏆 Vue Globale Reseau</div>
  <div class="card"><div class="frow">
    <div class="fgroup"><label>Periode</label>
      <div style="display:flex;gap:4px">
        <button class="btn btn-outline btn-sm" data-per="jour" onclick="setPeriode('cons-periode','jour',chargerCons)">Aujourd'hui</button>
        <button class="btn btn-outline btn-sm" data-per="semaine" onclick="setPeriode('cons-periode','semaine',chargerCons)">Semaine</button>
        <button class="btn btn-navy btn-sm" data-per="mois" onclick="setPeriode('cons-periode','mois',chargerCons)">Ce mois</button>
        <button class="btn btn-outline btn-sm" data-per="mois-1" onclick="setPeriode('cons-periode','mois-1',chargerCons)">Mois prec.</button>
      </div>
      <input type="hidden" id="cons-periode" value="mois">
    </div>
    <button class="btn btn-navy" onclick="chargerCons()">🔄 Actualiser</button>
  </div></div>
  <div id="cons-kpis" class="kpi-grid" style="margin:12px 0"></div>
  <div class="tbl-wrap"><table><thead><tr><th>Agence</th><th>CA Periode</th><th>Nb Factures</th><th>% Reseau</th></tr></thead>
  <tbody id="cons-tbody"><tr><td colspan="4" class="tbl-empty">Cliquez Actualiser</td></tr></tbody></table></div>
</div>
<div id="s-cons-stock" class="section">
  <div class="section-title">🌐 Stock Reseau</div>
  <div class="card"><div class="frow">
    <input type="text" id="cons-stock-q" placeholder="Reference ou designation..." style="width:280px">
    <button class="btn btn-navy" onclick="rechercherStockReseau()">🔍 Chercher dans tout le reseau</button>
  </div></div>
  <div id="cons-stock-result" style="margin-top:12px"></div>
</div>
{% endblock %}
