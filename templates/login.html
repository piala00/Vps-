<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXORA — Connexion</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
body{min-height:100vh;background:linear-gradient(135deg,#1A3263 0%,#0F172A 100%);
     display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:white;border-radius:16px;padding:40px;width:380px;
      box-shadow:0 24px 80px rgba(0,0,0,.4)}
.logo{text-align:center;margin-bottom:24px}
.logo h1{font-size:28px;font-weight:900;color:#1A3263;letter-spacing:3px}
.logo p{font-size:11px;color:#64748B;margin-top:4px}
.divider{height:3px;background:linear-gradient(90deg,#FBC013,#1A3263);
         border-radius:2px;margin:0 0 24px}
.societe{text-align:center;font-size:13px;font-weight:700;color:#1A3263;
         margin-bottom:20px;padding:10px;background:#F0F4FC;border-radius:8px}
label{display:block;font-size:11px;font-weight:700;color:#64748B;
      text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
input{width:100%;padding:11px 14px;border:2px solid #E2E8F0;border-radius:8px;
      font-size:14px;color:#1A3263;outline:none;transition:.2s;margin-bottom:14px}
input:focus{border-color:#1A3263}
button{width:100%;padding:13px;background:#1A3263;color:white;border:none;
       border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;
       transition:.2s;margin-top:4px}
button:hover{background:#142651}
.error{color:#EF4444;font-size:12px;text-align:center;margin-bottom:10px;
       padding:8px;background:#FEF2F2;border-radius:6px}
.mode-badge{text-align:center;margin-top:16px;font-size:10px;color:#94A3B8}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div style="font-size:40px">⚡</div>
    <h1>NEXORA</h1>
    <p>Plateforme ERP v2.0</p>
  </div>
  <div class="divider"></div>

  {% if config and config.nom_societe %}
  <div class="societe">🏢 {{ config.nom_societe }}</div>
  {% endif %}

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="POST">
    <label>Nom d'utilisateur</label>
    <input type="text" name="username" placeholder="Entrez votre identifiant"
           autofocus autocomplete="username">
    <label>Mot de passe <span style="color:#94A3B8;font-weight:400">(optionnel en mode conception)</span></label>
    <input type="password" name="password" placeholder="Laisser vide en mode conception"
           autocomplete="current-password">
    <button type="submit">Se connecter →</button>
  </form>
  <div class="mode-badge">Mode conception — Hamadou Youssouf, GTC Bertoua</div>
</div>
</body>
</html>
